<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="PromptStudio — 带信任机制的 Prompt / Skill 修改引擎。编辑 → AI 修改 → Diff 对比 → 逐块接受 → 版本沉淀，一次完成。">
<title>PromptStudio — 带信任机制的 Prompt 修改引擎（React 版）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236366F1'/%3E%3Ctext x='32' y='42' font-family='-apple-system,sans-serif' font-size='32' font-weight='700' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "framer-motion": "https://esm.sh/framer-motion@11.11.17?deps=react@18.3.1,react-dom@18.3.1"
  }
}
</script>
<style>
  :root{
    --bg:#fbfbfd;
    --bg-alt:#f5f5f7;
    --ink:#1d1d1f;
    --ink-2:#515154;
    --ink-3:#86868b;
    --line:rgba(0,0,0,.08);
    --brand:#6366F1;
    --brand-light:#818CF8;
    --brand-deep:#4f46e5;
    --green:#16A34A;
    --red:#DC2626;
    --blue:#2563EB;
    --amber:#D97706;
    --brand-gradient:linear-gradient(135deg,#6366F1,#818CF8);
    --glass-chrome:rgba(251,251,253,.72);
    --glass-float:rgba(255,255,255,.9);
    --focus-ring:rgba(99,102,241,.5);
    --shadow-float:0 2px 4px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.08);
    --radius-card:28px;
    --ease:cubic-bezier(0.16,1,0.3,1);
    --ease-nanfu:cubic-bezier(.38,0,0,1);
    --txt-grad:linear-gradient(150deg,#4F46E5 12%,#6366F1 52%,#A8B1FA 100%);
    --txt-grad-dark:linear-gradient(150deg,#818CF8 20%,#fff 95%);
    --dark:#0B0B12;
    --dark-2:#111119;
    --mono:"SF Mono","JetBrains Mono","Cascadia Code",ui-monospace,Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
    --spectrum:linear-gradient(90deg,var(--green) 0 25%,var(--red) 25% 50%,var(--blue) 50% 75%,var(--amber) 75% 100%);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  ::selection{background:rgba(99,102,241,.18)}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}
  section[id],.trust,.cta-final{scroll-margin-top:72px}
  a:focus-visible,button:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;border-radius:8px}
  ::-webkit-scrollbar{width:7px;height:7px}
  ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16);border-radius:999px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.3);border:2px solid transparent;background-clip:content-box}
  *{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.16) transparent}
  .progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:300;background:var(--brand-gradient);border-radius:0 2px 2px 0;box-shadow:0 0 8px rgba(99,102,241,.5);pointer-events:none}
  .nav{position:fixed;top:0;left:0;right:0;z-index:100;backdrop-filter:saturate(200%) blur(20px);-webkit-backdrop-filter:saturate(200%) blur(20px);background:var(--glass-chrome);border-bottom:1px solid transparent;transition:border-color .3s ease,background .3s ease}
  .nav.scrolled{border-bottom-color:var(--line)}
  .nav::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;pointer-events:none;opacity:.75;background:linear-gradient(90deg,rgba(99,102,241,.16),rgba(0,0,0,.06) 30%,rgba(0,0,0,.06) 70%,rgba(99,102,241,.12))}
  .nav-inner{max-width:1080px;margin:0 auto;height:52px;display:flex;align-items:center;gap:32px;padding:0 22px}
  .nav-logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:-.01em}
  .nav-links{display:flex;gap:28px;margin-left:auto;font-size:12.5px;color:var(--ink-2)}
  .nav-links a{transition:color .2s;position:relative}
  .nav-links a:hover{color:var(--ink)}
  .nav-links a.on{color:var(--ink)}
  .nav-links a.on::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--brand);box-shadow:0 0 6px rgba(99,102,241,.7)}
  .nav-cta{font-size:12.5px;padding:7px 16px;border-radius:980px;border:none;cursor:pointer;background:var(--brand-gradient);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(99,102,241,.28),inset 0 1px 0 rgba(255,255,255,.22);transition:filter .18s,transform .18s var(--ease),box-shadow .18s}
  .nav-cta:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 8px 20px rgba(99,102,241,.38),inset 0 1px 0 rgba(255,255,255,.26)}
  .nav-cta:active{transform:translateY(1px)}
  .nav-burger{display:none;margin-left:auto;background:none;border:none;cursor:pointer;width:32px;height:32px;position:relative}
  .nav-burger span{position:absolute;left:7px;right:7px;height:1.5px;background:var(--ink);transition:.25s var(--ease)}
  .nav-burger span:first-child{top:12px}.nav-burger span:last-child{bottom:12px}
  .txt-grad{background:var(--txt-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  .txt-grad-dark{background:var(--txt-grad-dark);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  .reveal{opacity:0;transform:translateY(36px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
  .reveal.in{opacity:1;transform:none}

  /* ---------- Logo mark：6 格描边方块 + 1 个放大发光橙红方块（品牌隐喻） ---------- */
  .mark-grid{display:inline-grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:3px;width:20px;height:20px;flex:none}
  .mark-grid i{border-radius:3px;border:1.4px solid rgba(99,102,241,.55);background:rgba(99,102,241,.06)}
  .mark-grid i.hot{grid-row:1 / 3;grid-column:3;border-color:transparent;background:linear-gradient(150deg,#F59E0B,#D97706);box-shadow:0 0 6px rgba(217,119,6,.5),inset 0 1px 0 rgba(255,255,255,.3)}
  .footer .mark-grid i{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.05)}
  .footer .mark-grid i.hot{box-shadow:0 0 8px rgba(217,119,6,.6),inset 0 1px 0 rgba(255,255,255,.3)}

  /* ---------- Hero ---------- */
  .hero{padding:150px 22px 0;text-align:center;position:relative;overflow:hidden}
  .hero-field{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:.55}
  .hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--brand-deep);background:rgba(255,255,255,.7);border:1px solid rgba(99,102,241,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:6px 14px;border-radius:980px;margin-bottom:38px;box-shadow:0 4px 14px rgba(99,102,241,.08)}
  .hero-eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--brand-gradient);box-shadow:0 0 8px rgba(99,102,241,.6)}
  .hero-mark{display:inline-grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:clamp(6px,1.1vw,12px);width:clamp(120px,22vw,220px);height:clamp(80px,14.6vw,146px);margin:0 auto;position:relative;z-index:1}
  .hero-mark .cell{border-radius:clamp(8px,1.4vw,16px);border:2px solid rgba(99,102,241,.4)}
  .hero-mark .cell.hot{grid-row:1 / 3;grid-column:3;border:none;background:linear-gradient(155deg,#FBBF24,#D97706);box-shadow:0 10px 34px rgba(217,119,6,.4),inset 0 2px 0 rgba(255,255,255,.35);display:grid;place-items:center;color:#fff;font-weight:700;font-size:clamp(28px,4.4vw,44px)}
  .hero-word{margin-top:26px;font-size:clamp(34px,5.6vw,58px);font-weight:700;letter-spacing:-.03em;position:relative;z-index:1}
  .hero .sub{margin:22px auto 0;max-width:560px;position:relative;z-index:1;font-size:clamp(16px,1.7vw,19px);line-height:1.6;color:var(--ink-3);font-weight:400}
  .hero .sub b{color:var(--ink-2);font-weight:600}
  .hero-actions{margin-top:34px;display:flex;gap:16px;justify-content:center;align-items:center;position:relative;z-index:1}
  .btn-primary{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;background:var(--brand-gradient);color:#fff;font-size:16px;font-weight:600;padding:13px 28px;border-radius:980px;border:none;cursor:pointer;will-change:transform;transition:filter .2s var(--ease),box-shadow .2s var(--ease);box-shadow:0 8px 24px rgba(99,102,241,.28),inset 0 1px 0 rgba(255,255,255,.22)}
  .btn-primary:hover{filter:brightness(1.06);box-shadow:0 14px 34px rgba(99,102,241,.38),inset 0 1px 0 rgba(255,255,255,.26)}
  .btn-primary:active{filter:brightness(.96);box-shadow:0 4px 12px rgba(99,102,241,.3),inset 0 1px 0 rgba(255,255,255,.16)}
  .btn-primary::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:36%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 4.8s var(--ease) infinite;pointer-events:none}
  @keyframes shine{0%{left:-60%}48%{left:130%}100%{left:130%}}
  .btn-link{font-size:16px;color:var(--brand-deep);display:inline-flex;align-items:center;gap:5px;transition:gap .2s var(--ease)}
  .btn-link:hover{gap:9px}

  /* ---------- App window mockup ---------- */
  .window{background:#fff;border-radius:18px;overflow:hidden;text-align:left;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 30px 80px -20px rgba(0,0,0,.18),0 12px 28px rgba(0,0,0,.08)}
  .window-bar{height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;background:linear-gradient(180deg,#fdfdfe,#f6f6f8);border-bottom:1px solid var(--line)}
  .dot{width:11px;height:11px;border-radius:50%}
  .dot.r{background:#FF5F57}.dot.y{background:#FEBC2E}.dot.g{background:#28C840}
  .window-title{margin-left:10px;font-size:12px;color:var(--ink-3);font-weight:500}
  .window-tabs{margin-left:auto;display:flex;gap:6px}
  .wtab{font-size:11px;color:var(--ink-3);padding:4px 10px;border-radius:6px;background:rgba(0,0,0,.04)}
  .wtab.on{background:#fff;color:var(--ink-2);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .mono{font-family:var(--mono)}
  .hero-stage{max-width:1080px;margin:64px auto 0;perspective:1600px;position:relative;z-index:1}
  .hero-window{transform-style:preserve-3d;transition:transform .35s var(--ease);will-change:transform}
  .app-grid{display:grid;grid-template-columns:1.55fr 1fr;min-height:420px}
  .editor-pane{border-right:1px solid var(--line);display:flex;flex-direction:column}
  .editor-toolbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:11px;color:var(--ink-3)}
  .chip-ruleset{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--brand-deep);background:rgba(99,102,241,.08);padding:3px 9px;border-radius:6px}
  .mock-spectrum{height:3px;background:var(--spectrum);opacity:.7}
  .code{padding:14px 0;font-size:11.5px;line-height:1.75;flex:1;overflow:hidden}
  .cline{display:flex;white-space:pre}
  .cline.active{background:rgba(99,102,241,.045)}
  .ln{width:38px;flex:none;text-align:right;padding-right:14px;color:#c7c7cc;user-select:none;font-family:var(--mono)}
  .lc{font-family:var(--mono)}
  .tok-k{color:#AF00DB}.tok-s{color:#A31515}.tok-c{color:#008000}.tok-h{color:#001080;font-weight:600}.tok-p{color:#795E26}
  .squig{background-image:linear-gradient(45deg,transparent 65%,#EAB308 65%),linear-gradient(-45deg,transparent 65%,#EAB308 65%);background-size:4px 3px;background-repeat:repeat-x;background-position:0 100%;padding-bottom:1px}
  .err-panel{border-top:1px solid var(--line);padding:10px 16px;font-size:11px;color:var(--ink-2);display:flex;align-items:center;gap:10px;background:#FFFDF5}
  .err-panel .warn{color:var(--amber);font-weight:600}
  .btn-mini{margin-left:auto;font-size:11px;font-weight:600;border:1px solid rgba(99,102,241,.3);color:var(--brand-deep);background:rgba(99,102,241,.06);padding:4px 12px;border-radius:6px;cursor:pointer;transition:background .2s}
  .btn-mini:hover{background:rgba(99,102,241,.12)}
  .chat-pane{display:flex;flex-direction:column;background:#fafafc}
  .chat-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:11px;color:var(--ink-3)}
  .model-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ink-2);background:#fff;border:1px solid var(--line);padding:3px 10px;border-radius:980px}
  .model-pill .pulse{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
  .chat-body{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
  .msg{max-width:92%;font-size:12px;line-height:1.6;padding:10px 13px;border-radius:14px}
  .msg.user{align-self:flex-end;background:linear-gradient(180deg,#6B6CF5,#6366F1);color:#fff;border-bottom-right-radius:4px;box-shadow:0 2px 10px rgba(99,102,241,.28),inset 0 1px 0 rgba(255,255,255,.16)}
  .msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;color:var(--ink-2);box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .msg.ai .caret{display:inline-block;width:8px;height:15px;border-radius:2px;background:var(--brand-gradient);vertical-align:-2px;margin-left:2px;animation:breathe 1s var(--ease) infinite}
  @keyframes breathe{0%,100%{opacity:.9}50%{opacity:.3}}
  .apply-bar{margin:0 14px 14px;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(129,140,248,.08));border:1px solid rgba(99,102,241,.22);border-radius:12px;padding:10px 12px}
  .apply-bar .t{font-size:11px;color:var(--brand-deep);font-weight:600}
  .apply-btn{margin-left:auto;font-size:11.5px;font-weight:600;color:#fff;background:var(--brand-gradient);border:none;padding:6px 14px;border-radius:8px;cursor:pointer;box-shadow:0 3px 10px rgba(99,102,241,.3),inset 0 1px 0 rgba(255,255,255,.22);transition:filter .18s,transform .18s var(--ease),box-shadow .18s}
  .apply-btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 5px 14px rgba(99,102,241,.4),inset 0 1px 0 rgba(255,255,255,.26)}

  /* ---------- Section scaffolding ---------- */
  section.block{padding:120px 22px}
  .wrap{max-width:1080px;margin:0 auto}
  .kicker{font-size:13px;font-weight:600;color:var(--brand);letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px}
  .block h2{font-size:clamp(40px,6vw,92px);font-weight:700;letter-spacing:-.04em;line-height:1.02}
  .block .lead{margin-top:22px;font-size:17px;line-height:1.65;color:var(--ink-3);max-width:560px}
  .block .lead b{color:var(--ink-2);font-weight:600}
  .center{text-align:center}
  .center .lead{margin-left:auto;margin-right:auto}
  .alt{background:var(--bg-alt)}

  /* Loop flow */
  .loop{display:flex;align-items:stretch;gap:0;margin-top:60px;flex-wrap:wrap;justify-content:center}
  .loop-step{flex:1;min-width:150px;max-width:190px;padding:26px 18px;text-align:center;position:relative;transition:transform .3s var(--ease)}
  .loop-step:hover{transform:translateY(-4px)}
  .loop-step + .loop-step::before{content:"";position:absolute;left:-8px;top:50%;width:16px;height:16px;border-top:2px solid #d2d2d7;border-right:2px solid #d2d2d7;transform:translateY(-50%) rotate(45deg)}
  .loop-num{width:44px;height:44px;margin:0 auto 14px;border-radius:14px;display:grid;place-items:center;font-size:16px;font-weight:700;color:var(--brand-deep);background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(129,140,248,.1));border:1px solid rgba(99,102,241,.2);box-shadow:0 8px 20px rgba(99,102,241,.12);opacity:.38;filter:saturate(.4);transition:opacity .45s var(--ease),filter .45s var(--ease),box-shadow .45s var(--ease),transform .45s var(--ease)}
  .loop-step.active .loop-num{opacity:1;filter:none;transform:scale(1.06);box-shadow:0 8px 20px rgba(99,102,241,.12),0 0 0 5px rgba(99,102,241,.14)}
  .loop-step h3{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ink-3);transition:color .45s var(--ease)}
  .loop-step.active h3{color:var(--ink)}
  .loop-step p{margin-top:7px;font-size:12.5px;line-height:1.55;color:var(--ink-3)}

  /* Diff showcase */
  .diff-toolbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-2);flex-wrap:wrap;background:linear-gradient(180deg,#fdfdfe,#fafafc)}
  .tb-btn{font-size:11.5px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink-2);padding:5px 12px;border-radius:7px;cursor:pointer;transition:border-color .2s,background .2s}
  .tb-btn:hover{border-color:#c7c7cc;background:#f6f6f8}
  .tb-btn.primary{background:var(--brand-gradient);border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(99,102,241,.28),inset 0 1px 0 rgba(255,255,255,.22)}
  .tb-btn.primary:hover{filter:brightness(1.06);background:var(--brand-gradient)}
  .tb-stats{margin-left:auto;font-size:11px;color:var(--ink-3);font-family:var(--mono);font-variant-numeric:tabular-nums}
  .diff-grid{display:grid;grid-template-columns:1fr 1fr;font-size:11.5px;line-height:1.8}
  .diff-col{padding:12px 0;border-right:1px solid var(--line)}
  .diff-col:last-child{border-right:none}
  .dline{display:flex;white-space:pre;font-family:var(--mono)}
  #diff .diff-grid .dline{opacity:.22;transform:translateX(-5px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
  #diff .diff-grid .dline.lit{opacity:1;transform:none}
  .d-add{background:rgba(22,163,74,.09)}
  .d-del{background:rgba(220,38,38,.08)}
  .d-del .dc{text-decoration:line-through;text-decoration-color:rgba(220,38,38,.5)}
  .d-rep{background:rgba(37,99,235,.08)}
  .badge{flex:none;width:16px;height:16px;margin:5px 4px 0 6px;border-radius:4px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff}
  .b-add{background:var(--green)}.b-del{background:var(--red)}.b-rep{background:var(--blue)}
  .diff-foot{display:flex;gap:18px;padding:10px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);font-family:var(--mono);background:#fafafc;flex-wrap:wrap;font-variant-numeric:tabular-nums}
  .diff-foot b{font-weight:600}
  .c-g{color:var(--green)}.c-r{color:var(--red)}

  /* Hover bubble + glass tab */
  .hover-demo{position:relative}
  .bubble{position:absolute;right:24px;top:96px;z-index:5;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:#fff;background:rgba(29,29,31,.92);backdrop-filter:blur(8px);padding:7px 13px;border-radius:980px;box-shadow:0 8px 22px rgba(0,0,0,.22);animation:float 3.2s ease-in-out infinite}
  .bubble::after{content:"";position:absolute;right:26px;bottom:-5px;width:10px;height:10px;background:rgba(29,29,31,.92);transform:rotate(45deg);border-radius:2px}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .glass-tab{position:absolute;top:0;right:0;bottom:0;width:250px;z-index:4;background:rgba(255,255,255,.78);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-left:1px solid rgba(255,255,255,.7);box-shadow:-20px 0 50px rgba(0,0,0,.1);padding:18px 16px;display:flex;flex-direction:column;gap:11px;overflow:hidden;transform:translateX(14px);opacity:0;transition:transform .7s var(--ease) .25s,opacity .7s var(--ease) .25s}

<div id="app"></div>
<script type="module">
import React, { useEffect, useRef, useState, useCallback } from 'react';
import { createRoot } from 'react-dom/client';
import { motion, useReducedMotion, AnimatePresence } from 'framer-motion';

const h = React.createElement;
const EASE = [0.38, 0, 0, 1];

/* ---------- 通用：滚动进入即揭示 ---------- */
function useReveal(threshold = 0.12) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((es) => {
      es.forEach((e) => { if (e.isIntersecting) { setInView(true); io.unobserve(e.target); } });
    }, { threshold, rootMargin: '0px 0px -5% 0px' });
    io.observe(el);
    return () => io.disconnect();
  }, [threshold]);
  return [ref, inView];
}

function mergeRefs(...refs) {
  return (node) => {
    refs.forEach((r) => {
      if (!r) return;
      if (typeof r === 'function') r(node);
      else r.current = node;
    });
  };
}

const Reveal = React.forwardRef(function Reveal({ as = 'div', delay = 0, className = '', children, ...rest }, forwardedRef) {
  const [ref, inView] = useReveal();
  const reduce = useReducedMotion();
  const Comp = motion[as] || motion.div;
  return h(Comp, {
    ref: mergeRefs(ref, forwardedRef), className,
    initial: reduce ? false : { opacity: 0, y: 36 },
    animate: inView ? { opacity: 1, y: 0 } : {},
    transition: { duration: 0.9, delay, ease: EASE },
    ...rest,
  }, children);
});

/* ---------- Logo mark：6 描边格 + 1 放大发光橙红块 ---------- */
function LogoMark({ size = 20, animated = false }) {
  const cells = [0, 1, 2, 3, 4]; /* 5 个普通格 + 1 个 hot（跨两行） */
  return h('span', {
    className: 'mark-grid', style: { width: size, height: size },
  },
    cells.map((i) => h(motion.i, {
      key: i,
      initial: animated ? { opacity: 0, scale: 0.6 } : false,
      animate: animated ? { opacity: 1, scale: 1 } : false,
      transition: animated ? { delay: 0.06 * i, duration: 0.4, ease: EASE } : undefined,
    })),
    h(motion.i, {
      className: 'hot',
      initial: animated ? { opacity: 0, scale: 0.5 } : false,
      animate: animated ? { opacity: 1, scale: 1 } : false,
      transition: animated ? { delay: 0.34, duration: 0.5, ease: EASE } : undefined,
    })
  );
}

/* ---------- 导航 ---------- */
const NAV_LINKS = [
  ['loop', '工作闭环'], ['diff', 'Diff 对比'], ['trust-panel', '信任机制'],
  ['providers', '多模型接入'], ['versions', '版本沉淀'],
];

function Nav() {
  const [scrolled, setScrolled] = useState(false);
  const [progress, setProgress] = useState(0);
  const [active, setActive] = useState('');

  useEffect(() => {
    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const max = document.documentElement.scrollHeight - innerHeight;
        setProgress(max > 0 ? (scrollY / max) * 100 : 0);
        setScrolled(scrollY > 8);
        ticking = false;
      });
    };
    addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => removeEventListener('scroll', onScroll);
  }, []);

  useEffect(() => {
    const sections = NAV_LINKS.map(([id]) => document.getElementById(id)).filter(Boolean);
    const io = new IntersectionObserver((es) => {
      es.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); });
    }, { threshold: 0.01, rootMargin: '-20% 0px -60% 0px' });
    sections.forEach((s) => io.observe(s));
    return () => io.disconnect();
  }, []);

  return h(React.Fragment, null,
    h('div', { className: 'progress', style: { width: progress + '%' } }),
    h('nav', { className: 'nav' + (scrolled ? ' scrolled' : '') },
      h('div', { className: 'nav-inner' },
        h('a', { className: 'nav-logo', href: '#top' }, h(LogoMark, { size: 20 }), 'PromptStudio'),
        h('div', { className: 'nav-links' },
          NAV_LINKS.map(([id, label]) => h('a', {
            key: id, href: '#' + id, className: active === id ? 'on' : '',
          }, label))
        ),
        h('a', { className: 'nav-cta', href: 'dist/index.html?first=1' }, '免费使用'),
        h('button', { className: 'nav-burger', 'aria-label': '菜单' }, h('span'), h('span'))
      )
    )
  );
}

/* ---------- Hero：Logo 为主视觉 + 磁性 CTA ---------- */
function MagneticLink({ className, href, children }) {
  const ref = useRef(null);
  const reduce = useReducedMotion();
  const onMove = useCallback((e) => {
    if (reduce || !matchMedia('(pointer:fine)').matches) return;
    const el = ref.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left - r.width / 2) / r.width;
    const y = (e.clientY - r.top - r.height / 2) / r.height;
    el.style.translate = `${(x * 6).toFixed(1)}px ${(y * 5).toFixed(1)}px`;
  }, [reduce]);
  const onLeave = useCallback(() => { if (ref.current) ref.current.style.translate = ''; }, []);
  return h('a', { ref, className, href, onMouseMove: onMove, onMouseLeave: onLeave }, children);
}

function Hero() {
  const reduce = useReducedMotion();
  const stageRef = useRef(null);
  const winRef = useRef(null);

  const onStageMove = useCallback((e) => {
    if (reduce || !matchMedia('(pointer:fine)').matches) return;
    const win = winRef.current, stage = stageRef.current;
    if (!win || !stage) return;
    const r = stage.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    win.style.transform = `rotateX(${(-y * 4).toFixed(2)}deg) rotateY(${(x * 5).toFixed(2)}deg)`;
  }, [reduce]);
  const onStageLeave = useCallback(() => { if (winRef.current) winRef.current.style.transform = ''; }, []);

  return h('header', { className: 'hero', id: 'top' },
    h(Reveal, { className: 'hero-eyebrow' }, h('span', { className: 'dot' }), '本地优先 · 离线可用 · 零上传承诺'),

    h(motion.div, {
      className: 'hero-mark',
      initial: reduce ? false : { opacity: 0 },
      animate: { opacity: 1 },
      transition: { duration: 0.3 },
    },

function useCountUp(target, active, reduce) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!active) return;
    if (reduce) { setVal(target); return; }
    let raf; const t0 = performance.now(); const dur = 1200;
    const tick = (t) => {
      const k = Math.min(1, (t - t0) / dur);
      setVal(Math.round((1 - Math.pow(1 - k, 3)) * target));
      if (k < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [active, target, reduce]);
  return val;
}

function useRingProgress(target, active, reduce) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!active) return;
    if (reduce) { setVal(target); return; }
    let raf; const t0 = performance.now(); const dur = 1000;
    const tick = (t) => {
      const k = Math.min(1, (t - t0) / dur);
      setVal((1 - Math.pow(1 - k, 3)) * target);
      if (k < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [active, target, reduce]);
  return val;
}
